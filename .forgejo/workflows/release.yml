name: 'publish'

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows
    steps:
      - uses: actions/checkout@v4

      - uses: https://github.com/dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm install

      - name: Run unit tests
        run: npm run test

      - name: Build Tauri app
        run: npm run tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Collect bundle artifacts
        shell: bash
        run: |
          mkdir -p collected
          cp src-tauri/target/release/bundle/nsis/* collected/ 2>/dev/null || true

      - uses: actions/upload-artifact@v3
        with:
          name: bundle-windows
          path: collected/*
          retention-days: 1

  build-linux:
    runs-on: linux
    container: node:20-bookworm
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev xdg-utils

      - uses: https://github.com/dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm install

      - name: Run unit tests
        run: npm run test

      - name: Build Tauri app
        run: npm run tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Collect bundle artifacts
        run: |
          mkdir -p collected
          cp src-tauri/target/release/bundle/appimage/* collected/ 2>/dev/null || true

      - uses: actions/upload-artifact@v3
        with:
          name: bundle-linux
          path: collected/*
          retention-days: 1

  release:
    needs: [build-windows, build-linux]
    runs-on: linux
    container: node:20-bookworm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v3
        with:
          path: artifacts

      - name: Lay out artifacts by platform for the manifest builder
        run: |
          mkdir -p release/windows release/linux
          cp artifacts/bundle-windows/* release/windows/ 2>/dev/null || true
          cp artifacts/bundle-linux/* release/linux/ 2>/dev/null || true

      - name: Build the merged updater manifest
        run: node scripts/build-latest-json.mjs release "${{ github.ref_name }}"

      - name: Flatten release assets
        run: |
          mkdir -p dist/release
          find release -maxdepth 2 -type f -exec cp {} dist/release/ \;

      - uses: https://code.forgejo.org/actions/forgejo-release@v2
        with:
          direction: upload
          release-dir: dist/release
          title: 'Feather MD ${{ github.ref_name }}'
